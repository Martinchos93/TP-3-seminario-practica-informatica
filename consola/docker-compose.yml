services:

  mysql:
    image: mysql:8.4
    container_name: tribu-consola-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tribu_consola
      MYSQL_USER: tribu
      MYSQL_PASSWORD: tribu
    ports:
      - "3308:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - datos-consola:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  consola:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tribu_consola?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Cordoba
      DB_USER: tribu
      DB_PASSWORD: tribu
    stdin_open: true
    tty: true

volumes:
  datos-consola:
